<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>TELLURIC VOID</title>
    <!-- Inlined so there is no favicon request; the 404 was polluting the
         capture harness's error count and masking real page errors. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d1117'/%3E%3Cpath d='M16 5l9 22H7z' fill='%2339d6d2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/ui/hud.css" />
  </head>
  <body>
    <!-- The canvas is the game. Unnamed it is announced as "canvas", with no
         hint that it is interactive or how; the description carries the short
         version of the controls so an assistive-technology user is not obliged
         to find the settings screen to learn that WASD moves. -->
    <canvas
      id="viewport"
      tabindex="0"
      role="application"
      aria-label="Telluric Void — game viewport"
      aria-describedby="viewport-help"
    ></canvas>
    <p id="viewport-help" class="a11y-only">
      Move with W, A, S and D. Aim with the mouse, fire with the left button.
      Q, E, Shift and Space use your abilities and equipment. Press Escape to
      pause and open the menus, where every screen is navigable with the
      arrow keys, Enter and Escape, or with a gamepad.
    </p>
    <div id="hud"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
